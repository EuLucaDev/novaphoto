[package]
name = "novaphoto-cli"
description = "Headless Novaphoto: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional novaphoto-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["novaphoto-codecs/heif"]

[lints]
workspace = true

[lib]
name = "novaphoto_cli"
path = "src/lib.rs"

[[bin]]
name = "novaphoto-cli"
path = "src/main.rs"

[dependencies]
novaphoto-automation = { path = "../../crates/automation" }
novaphoto-engine = { workspace = true }
novaphoto-io = { workspace = true }
novaphoto-format = { path = "../../crates/format" }
novaphoto-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for novaphoto-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

